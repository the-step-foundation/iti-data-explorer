name: Deploy dashboards

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "mh_baseline/dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js from the PROXY_URL repository variable
        env:
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          printf '// generated by .github/workflows/pages.yml\nwindow.ITI_CONFIG = %s;\n' \
            "$(jq -cn --arg u "$PROXY_URL" '{proxyUrl: $u}')" > dashboard/config.js
          cat dashboard/config.js

      - name: Assemble combined site (ITI Data Explorer at /, MH ITI baseline at /mh-baseline/)
        run: |
          mkdir -p _site
          cp -r dashboard/. _site/
          mkdir -p _site/mh-baseline
          cp -r mh_baseline/dashboard/. _site/mh-baseline/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
